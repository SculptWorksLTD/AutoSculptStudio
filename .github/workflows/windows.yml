# AutoSculpt Studio - builds the Windows installer from the published channel files. © 2026 Enrico Migliorati. All rights reserved.
# Runs when update.json changes (a new version) or by hand; the installer goes to download/AutoSculptStudio-Setup.exe.
name: Windows installer
on:
  push:
    branches: [main]
    paths: ['update.json', '.github/build/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-installer
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
      - name: Program folder and test
        run: python .github/build/build_windows.py
      - name: Installer
        shell: pwsh
        run: |
          $v = Get-Content build/win/version.txt
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) { $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          New-Item -ItemType Directory -Force download | Out-Null
          & $mk /INPUTCHARSET UTF8 "/DVERSION=$v" .github/build/AutoSculptStudio.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item download/AutoSculptStudio-Setup.exe
      - name: Publish the installer in the channel
        shell: pwsh
        run: |
          git config user.name "AutoSculpt Studio build"
          git config user.email "actions@users.noreply.github.com"
          git add download/AutoSculptStudio-Setup.exe
          git commit -m "Windows installer [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
