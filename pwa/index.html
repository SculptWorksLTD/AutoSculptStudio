<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutoSculpt Studio</title>
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
:root{--bg:#1e1e1e;--panel:#2a2a2a;--ink:#e2e2e2;--muted:#9b9b9b;--line:#3b3b3b;--accent:#3d7fe6;--ok:#6cc08f;--bad:#ff6b5e;--warn:#e2b457;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header img{width:34px;height:34px;border-radius:8px}
header b{font-size:18px}
header small{display:block;color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.mic{width:100%;padding:22px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:20px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.mic.rec{background:var(--bad)}
.mic span{font-size:44px;line-height:1}
.level{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.level div{height:100%;width:0;background:var(--accent)}
textarea{width:100%;font:inherit;color:var(--ink);background:#1b1b1b;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;min-height:84px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.ck{display:flex;gap:8px;align-items:center}
select{font:inherit;color:var(--ink);background:#1b1b1b;border:1px solid var(--line);border-radius:8px;padding:6px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:#333;color:var(--ink);border-radius:10px;padding:12px 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
.note{color:var(--muted);font-size:14px;margin:0}
.note.err{color:var(--bad)}
h2{font-size:15px;margin:4px 0 8px;color:var(--muted);font-weight:600}
.req{display:flex;gap:10px;align-items:center;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;width:100%;text-align:left;color:inherit;font:inherit}
.req img,.req .ph{width:64px;height:64px;border-radius:6px;object-fit:cover;background:#111;flex:none}
.req .tx{min-width:0;flex:1}.req b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:13px;color:var(--muted)}.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}.st.wait{color:var(--warn)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}.bar div{height:100%;background:var(--accent)}
.pics{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pics button{padding:0;border:3px solid transparent;border-radius:8px;background:#fff;overflow:hidden}
.pics img{display:block;width:100%}
.photos{display:flex;gap:6px;flex-wrap:wrap}.photos img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.big{width:100%;border-radius:8px;background:#fff}
</style>
</head>
<body>

}

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* the voice note: recorded as WAV, 16 kHz mono (small, and every service reads it) */
let REC = null, AUDIO = null;
async function recStart() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });

/* photos from the camera or the gallery (largest side 2048 px) */
let PHOTOS = [];

/* sending: the parts of one request, the last one says it is complete */
async function send() {

    for (let i = 0; i < parts.length; i++) {

}
$('send') && ($('send').onclick = send);

/* the requests and how far they got */
let MINE = {}; try { MINE = JSON.parse(localStorage.getItem('studioMine') || '{}'); } catch (e) {}

    saveMine(); render();
  } catch (e) {}
  timer = setTimeout(poll, Object.values(MINE).some(x => !['done', 'error', 'gemini'].includes(x.state)) ? 4000 : 15000);
}
function stateLine(x) {
  const cls = x.state === 'done' ? 'ok' : x.state === 'error' ? 'bad' : x.state === 'choose' || x.state === 'gemini' ? 'wait' : '';
  return `<span class="st ${cls}">${esc(T[x.state] || x.state || '')}${x.state === 'model' && x.progress ? ' · ' + x.progress + '%' : ''}</span>`;
}
function render() {
  if (OPEN) return renderDetail();
  const list = Object.values(MINE).sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 30);
  $('list').innerHTML = list.length ? list.map(x => `<button class="req" data-id="${esc(x.id)}">${x.thumb ? `<img src="${x.thumb}" alt="">` : (x.thumbs && x.thumbs[0] ? `<img src="${x.thumbs[0]}" alt="">` : '<span class="ph"></span>')}
    <span class="tx"><b>${esc(x.title || '…')}</b>${stateLine(x)}${x.state === 'model' ? `<div class="bar"><div style="width:${x.progress || 5}%"></div></div>` : ''}</span></button>`).join('') : `<p class="note">${T.none}</p>`;
  document.querySelectorAll('.req').forEach(b => { b.onclick = () => { OPEN = b.dataset.id; $('main').hidden = true; $('detail').hidden = false; render(); poll(); }; });
}
function renderDetail() {
  const x = MINE[OPEN] || {};
  let body = `<button class="btn" id="back">${T.back}</button><div class="card"><b>${esc(x.title || '')}</b>${stateLine(x)}`;
  if (x.state === 'choose' && x.thumbs) body += `<p class="note">${T.pick}</p><div class="pics">${x.thumbs.map((u, i) => `<button data-i="${i}"><img src="${u}" alt=""></button>`).join('')}</div>`;
  else if (x.state === 'gemini') body += `<p class="note">${T.gemHelp}</p><textarea id="gemP" readonly rows="6" style="width:100%">${esc(x.prompt || '')}</textarea>
    <div class="row"><button class="btn" id="gemCopy">${T.copyP}</button><a class="btn primary" href="https://gemini.google.com/app" target="_blank" rel="noopener">${T.openGem}</a></div>`;
  else if (x.state === 'done') body += `${x.thumb ? `<img class="big" src="${x.thumb}" alt="">` : ''}<p class="note">${T.ready}</p>`;
  else if (x.state === 'error') body += `<p class="note err">${esc(x.message || '')}</p>`;
  else if (x.thumb) body += `<img class="big" src="${x.thumb}" alt="">${x.state === 'model' ? `<div class="bar"><div style="width:${x.progress || 5}%"></div></div>` : ''}`;
  $('detail').innerHTML = body + '</div>';
  if ($('gemCopy')) $('gemCopy').onclick = async () => { const t = $('gemP'); t.select(); let ok = false; try { await navigator.clipboard.writeText(t.value); ok = true; } catch (e) { try { ok = document.execCommand('copy'); } catch (e2) {} } if (ok) alertNote(T.copiedP); };
  $('back').onclick = () => { OPEN = null; $('detail').hidden = true; $('main').hidden = false; render(); };
  document.querySelectorAll('.pics button').forEach(b => { b.onclick = async () => {
    const r = await fetch(`/send?id=${OPEN}&part=${10 + (x.picks = (x.picks || 0) + 1)}&last=1`, { method: 'POST', headers: { ...H(), 'Content-Type': 'application/json' }, body: JSON.stringify({ pick: +b.dataset.i }) });
    if (r.ok) { x.state = 'model'; x.progress = 0; saveMine(); render(); alertNote(T.picked); poll(); }
  }; });
}
function alertNote(t) { const n = document.createElement('p'); n.className = 'note'; n.textContent = t; $('detail').appendChild(n); }
if (K) { render(); poll(); }
</script>
</body>
